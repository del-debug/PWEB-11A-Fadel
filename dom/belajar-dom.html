<!--DOM adalah singkatan dari Document Object Model. Itu adalah antarmuka pemrograman untuk dokumen HTML dan XML.-->
<p id="artinya"></p>

<p class="sub-arti"></p>
<body>
    
</body>
<script>
    document.getElementById("judul").innerHTML = "DOM adalah singkatan dari Document Object Model. Itu adalah antarmuka pemrograman untuk dokumen HTML dan XML.";

    const artinya = document.getElementById('artinya');
    artinya.textContent = "DOM adalah singkatan dari Document Object Model. Itu adalah antarmuka pemrograman untuk dokumen HTML dan XML."

    //pakai querySelector
    const artinyaP = document.querySelector('.artinya')
    //atau
    const subArti = document.querySelector('#artinya');

    //pakai classByName
    const subArtiElements = document.getElementsByClassName('sub-arti');
    artinya.textContent = "Contoh penggunaan getElementsByClassName";

</script>
